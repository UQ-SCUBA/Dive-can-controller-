; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = round

; Shared options
[env]
build_flags =
  ; Don't use lv_conf.h. Tweak params via platfom.ini.
  -D LV_CONF_SKIP
  -D LV_CONF_INCLUDE_SIMPLE
  ; Font sizes the dive-screen UI uses (montserrat_14 is already on by default)
  -D LV_FONT_MONTSERRAT_12=1
  -D LV_FONT_MONTSERRAT_16=1
  -D LV_FONT_MONTSERRAT_18=1
  -D LV_FONT_MONTSERRAT_20=1
  -D LV_FONT_MONTSERRAT_24=1
  -D LV_FONT_MONTSERRAT_28=1
  -D LV_FONT_MONTSERRAT_30=1
  -D LV_FONT_MONTSERRAT_40=1
  -D LV_FONT_MONTSERRAT_46=1
  ; Needed for the custom fonts under src/fonts/ (lv_font_conv-generated) to
  ; resolve their "#include lvgl.h" the same simple way on every target, not
  ; just the emulator env that originally carried this flag alone.
  -D LV_LVGL_H_INCLUDE_SIMPLE
  ; Add more defines below to overide lvgl:/src/lv_conf_simple.h
lib_deps =
  ; Use direct URL, because package registry is unstable
  lvgl@9.3
lib_archive = false


[env:emulator_64bits]
platform = native@^1.1.3
extra_scripts = 
  pre:support/sdl2_paths.py ; Tries to find SDL2 include and lib paths on your system - specifically for MacOS w/ Homebrew
  post:support/sdl2_build_extra.py
build_flags =
  ${env.build_flags}
  ; -D LV_LOG_LEVEL=LV_LOG_LEVEL_INFO
  -D LV_LOG_PRINTF=1
  -I hal/sdl2
  -lSDL2
  ; SDL drivers options
  -D LV_DRV_NO_CONF
  -D LV_USE_SDL
  ; Hardware-accelerated SDL rendering (the LVGL default) waits on the
  ; window manager's Present/vsync callback to finish each frame. Under some
  ; X11 compositors that callback stalls for the whole duration a mouse
  ; button is held down without moving (an implicit-grab quirk), which
  ; blocks hal_loop()'s single-threaded lv_timer_handler() call — freezing
  ; every LVGL timer, including the one driving the hold-to-sleep gesture's
  ; timing, until release. Software rendering blits directly with no
  ; compositor handshake, so held-button gestures keep ticking.
  -D LV_SDL_ACCELERATED=0
  ; Wider than the CYD's 320x240 so the sim-only debug panel has room
  ; alongside the device area (see src/input_sim_debug.cpp).
  -D SDL_HOR_RES=640
  -D SDL_VER_RES=320
  -D SDL_ZOOM=1
  -D LV_SDL_INCLUDE_PATH="\"SDL2/SDL.h\""

  ; LVGL memory options, setup for the demo to run properly
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_SIZE="(128U * 1024U)"
  
lib_deps =
  ${env.lib_deps}
build_src_filter =
  +<*>
  +<../hal/sdl2>
  -<ui_dive_screen_round.cpp>
  -<ui_hold_bar_round.cpp>
  -<ui_heartbeat_round.cpp>
  -<ui_gas_edit_screen_round.cpp>
  -<fonts/*> ; 7-segment fonts are round-screen-only (see ui_dive_screen_round.cpp)


[env:emulator_32bits]
extends = env:emulator_64bits
build_flags =
  ${env:emulator_64bits.build_flags}
  -m32
build_src_filter =
  +<*>
  +<../hal/sdl2>
  -<ui_dive_screen_round.cpp>
  -<ui_hold_bar_round.cpp>
  -<ui_heartbeat_round.cpp>
  -<ui_gas_edit_screen_round.cpp>
  -<fonts/*>

; SDL sim of the round GC9B72 target (see env:round below) -- 360x360 window,
; same DEVICE_SHAPE_ROUND flag and round ui_*.cpp swap, so the dial layout
; can be iterated on visually without the physical board. Keeps the sim
; debug panel (input_sim_debug.cpp) since it drives the same onMenu/onAction
; entry points the real GPIO buttons will.
[env:emulator_round]
extends = env:emulator_64bits
build_flags =
  ${env:emulator_64bits.build_flags}
  -D DEVICE_SHAPE_ROUND=1
  ; 360 device area + the sim debug panel alongside it (see
  ; input_sim_debug.cpp), same layout idea as emulator_64bits' 640=320+debug.
  -D SDL_HOR_RES=670
  -D SDL_VER_RES=360
build_src_filter =
  +<*>
  +<../hal/sdl2>
  -<ui_dive_screen.cpp>
  -<ui_hold_bar.cpp>
  -<ui_heartbeat.cpp>
  -<ui_gas_edit_screen.cpp>

; Native unit tests for the pure state/deco/gestures logic (dive-mode
; transitions, setpoint bailout blanking, bailout gas selection) -- no LVGL
; rendering, no HAL, no display. Run with `pio test -e test_logic`.
[env:test_logic]
platform = native@^1.1.3
test_build_src = true
build_flags =
  ${env.build_flags}
lib_deps =
  ${env.lib_deps}
build_src_filter =
  +<state.cpp>
  +<deco.cpp>
  +<gestures.cpp>

[env:stm32f429_disco]
platform = ststm32@^8.0.0
board = disco_f429zi
framework = stm32cube
build_flags =
  ${env.build_flags}
  -D LV_LOG_LEVEL=LV_LOG_LEVEL_NONE
  ; header's default is 25MHz, but board uses 8MHz crystal
  -D HSE_VALUE=8000000
  -I hal/stm32f429_disco
lib_deps =
  ${env.lib_deps}
  BSP-ili9341
  BSP-stmpe811
build_src_filter =
  +<*>
  +<../hal/stm32f429_disco>
  ; Force compile LVGL demo, remove when working on your own project
  +<../.pio/libdeps/stm32f429_disco/lvgl/demos>
  -<ui_dive_screen_round.cpp>
  -<ui_hold_bar_round.cpp>
  -<ui_heartbeat_round.cpp>
  -<ui_gas_edit_screen_round.cpp>
  -<fonts/*>

; ESP32-2432S028R "Cheap Yellow Display" — see hal/esp32/displays/LGFX_CYD_2432S028.hpp
; for the pin mapping (unverified against real hardware — no board on hand yet).
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
  ${env.build_flags}
  -D LV_LOG_LEVEL=LV_LOG_LEVEL_NONE
  -I hal/esp32
  -I hal/esp32/displays
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@^1.2.0
build_src_filter =
  +<*>
  +<../hal/esp32>
  -<input_sim_debug.cpp> ; sim-only debug panel, not part of the real device build
  -<ui_dive_screen_round.cpp>
  -<ui_hold_bar_round.cpp>
  -<ui_heartbeat_round.cpp>
  -<ui_gas_edit_screen_round.cpp>
  -<fonts/*>

; 2.1" round GC9B72 360x360 SPI panel — see hal/esp32/displays/LGFX_GC9B72_360.hpp
; for the panel driver (no dedicated LovyanGFX class exists for this IC; it's
; a GC9A01 subclass resized to 360x360, unverified against real hardware —
; no board on hand yet) and the pin mapping (also placeholder). Menu/Action
; are two physical GPIO buttons (this module has no touch controller) — see
; app_hal.cpp's DEVICE_SHAPE_ROUND input path. Current default target.
[env:round]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
  ${env.build_flags}
  -D LV_LOG_LEVEL=LV_LOG_LEVEL_NONE
  -D DEVICE_SHAPE_ROUND=1
  -I hal/esp32
  -I hal/esp32/displays
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@^1.2.0
build_src_filter =
  +<*>
  +<../hal/esp32>
  -<input_sim_debug.cpp> ; sim-only debug panel, not part of the real device build
  -<ui_dive_screen.cpp>
  -<ui_hold_bar.cpp>
  -<ui_heartbeat.cpp>
  -<ui_gas_edit_screen.cpp>